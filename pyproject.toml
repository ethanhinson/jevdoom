[project]
name = "jevfun"
version = "0.1.0"
description = "Jev (TypeSafe System One) plays games: Doom and Tetris"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "pyboy>=2.7.0",
    "pygame>=2.6.1",
    "python-dotenv>=1.2.3",
    "typesafe-sdk>=0.7.1",
    "vizdoom>=1.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[project.scripts]
jevdoom = "jevdoom.run:main"
jevtetris = "jevtetris.run:main"
jevgameboy = "jevtetris.run_gameboy:main"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevcommon", "jevdoom", "jevtetris"]
